services:
  postgres:
    image: postgres:16
    container_name: pawmade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pawmade
      POSTGRES_USER: pawmade
      POSTGRES_PASSWORD: pawmade
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: