# Application
spring.application.name=pawmate
# PostgreSQL (docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/pawmade
spring.datasource.username=pawmade
spring.datasource.password=pawmade
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Seed (rejouable sans risque, voir le script ci-dessous)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:sql/INSERT_ALIVE.sql
spring.jpa.defer-datasource-initialization=true
# Stockage des photos
pawmade.storage.root=${user.home}/pawmade-storage